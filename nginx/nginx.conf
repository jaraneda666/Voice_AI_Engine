# ==============================================================================
# Nginx Reverse Proxy Configuration - Voice_AI_Engine
# Hardening: TLS 1.3 | OWASP Top 10 API Security | Host Whitelist
# ==============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off; # Ocultar versión de Nginx (OWASP Web Security)

    # Límite máximo para subida de audios (50MB de audio + overhead multipart)
    client_max_body_size 60M;

    # Rate Limiting (OWASP API4:2023 - Unrestricted Resource Consumption)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream al API Gateway del Motor de IA
    upstream ai_backend {
        server ai-gateway:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Upstream al Microservicio RAG & Ingesta Documental
    upstream rag_backend {
        server rag-service:8090 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 8443 ssl http2;
        server_name voice-ai.local localhost 127.0.0.1;

        # ----------------------------------------------------------------------
        # Parámetros Criptográficos TLS 1.3 / 1.2
        # ----------------------------------------------------------------------
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # ----------------------------------------------------------------------
        # Cabeceras de Seguridad (OWASP Secure Headers)
        # ----------------------------------------------------------------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ----------------------------------------------------------------------
        # Control de Acceso: Whitelist Estricta de Hosts e IPs Autorizadas
        # ----------------------------------------------------------------------
        # Se permiten exclusivamente conexiones desde localhost y subredes LAN confiables
        allow 127.0.0.1;
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;   # Subred de contenedores Docker
        allow 10.0.0.0/8;
        deny all;              # Bloqueo total de cualquier otro host no autorizado

        # Manejo de error 403 personalizado para auditoría
        error_page 403 /403.json;
        location = /403.json {
            default_type application/json;
            return 403 '{"error": "Forbidden", "detail": "Host no autorizado para acceder al motor de IA", "compliance": "OWASP API Security"}';
        }

        # ----------------------------------------------------------------------
        # Proxy Inverso hacia el API Gateway
        # ----------------------------------------------------------------------
        location / {
            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://ai_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";

            # Hard timeouts for Whisper and LLM inference (OWASP LLM10:2025)
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # Acceso Web al Motor RAG (Ingesta y Búsqueda Semántica)
        # ----------------------------------------------------------------------
        location = /rag {
            return 301 /rag/;
        }

        location /rag/ {
            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://rag_backend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";

            # Límite máximo para subida de documentos clínicos (PDF/DOCX/TXT)
            client_max_body_size 30M;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Endpoint de salud del proxy
        location /proxy-health {
            default_type application/json;
            return 200 '{"status": "online", "proxy": "nginx-tls1.3", "engine": "Voice_AI_Engine"}';
        }
    }
}
