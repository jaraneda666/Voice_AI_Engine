# ==============================================================================
# Docker Compose Override - Perfil de Ejecución 100% CPU
# Voice AI Engine - Private & Autonomous Clinical Speech & Medical NLP Subsystem
# Propósito: Permite levantar todo el stack de IA en entornos sin GPU NVIDIA (macOS, Linux o Windows)
# Uso: docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d --build
# ==============================================================================

services:
  whisper-service:
    environment:
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_CPU_FALLBACK=true
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
          devices: []

  ollama-service:
    environment:
      - OLLAMA_NUM_GPU=0
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G
          devices: []
