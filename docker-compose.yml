# ==============================================================================
# Docker Compose - Subsistema Completo de Inteligencia Artificial On-Premise
# Sistema Voice AI - Centro de Salud Mental y Terapia Especializada
# Seguridad:
# - Canal Cifrado Externo: Nginx Reverse Proxy (HTTPS / TLS 1.3) con Whitelist de Hosts
# - Aislamiento Interno Estricto: whisper-service y ollama-service sin exposición de puertos al host
# - Gestión Bastionada: Portainer CE por HTTPS seguro (puerto 9443)
# - Ley N° 21.719 (Datos Biométricos): Audio volátil en RAM (/tmp/audio_ram) con destrucción física
# - CIS Docker Benchmark v1.6.0: Contenedores non-root, read-only y cap_drop ALL
# ==============================================================================

networks:
  voice-ai-net:
    name: voice-ai-net
    driver: bridge
    attachable: false
    labels:
      com.voiceai.security: "isolated-ai-tier"

volumes:
  whisper_cache:
    name: voice_whisper_cache
  ollama_data:
    name: voice_ollama_data
  portainer_data:
    name: voice_portainer_data
  rag_data:
    name: voice_rag_data

services:
  # ----------------------------------------------------------------------------
  # 1. Proxy Inverso Seguro Nginx (TLS 1.3 + Whitelist de Hosts Autorizados)
  # ----------------------------------------------------------------------------
  nginx-proxy:
    image: nginx:1.27-alpine
    container_name: voice-nginx-proxy
    restart: unless-stopped
    ports:
      # Única puerta de enlace expuesta para el consumo de la API de IA
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - voice-ai-net
    depends_on:
      ai-gateway:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1:8443/proxy-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------------------------------
  # 2. API Gateway del Motor de IA (Orquestador Interno)
  # ----------------------------------------------------------------------------
  ai-gateway:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
      network: host
    image: voice-ai-gateway:1.0.0
    container_name: voice-ai-gateway
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256M,mode=1777
    expose:
      # Solo accesible internamente por el proxy Nginx en voice-ai-net
      - "8080"
    networks:
      - voice-ai-net
    environment:
      - WHISPER_URL=http://whisper-service:8000
      - OLLAMA_URL=http://ollama-service:11434
      - RAG_URL=http://rag-service:8090
      - LLM_MODEL=${LLM_MODEL:-llama3.1:8b-instruct-q4_K_M}
    depends_on:
      whisper-service:
        condition: service_healthy
      ollama-service:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G

  # ----------------------------------------------------------------------------
  # 3. Servicio de Transcripción Fonética (whisper-service)
  # ----------------------------------------------------------------------------
  whisper-service:
    build:
      context: ./whisper-service
      dockerfile: Dockerfile
      network: host
    image: voice-whisper-service:1.0.0
    container_name: voice-whisper-service
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Cero puertos expuestos en el host: aislamiento total en voice-ai-net
    expose:
      - "8000"
    tmpfs:
      - /tmp:size=1G,mode=1777
      - /tmp/audio_ram:size=512M,mode=1700,uid=10001,gid=10001
      - /app/.cache:size=1G,mode=1777
    volumes:
      - whisper_cache:/models:rw
    env_file:
      - path: .env
        required: false
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3-turbo}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cuda}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-float16}
      - WHISPER_CPU_FALLBACK=${WHISPER_CPU_FALLBACK:-true}
      - AUDIO_RAM_DIR=/tmp/audio_ram
      - MAX_AUDIO_SIZE_MB=${MAX_AUDIO_SIZE_MB:-50}
      - HF_HOME=/models
    networks:
      - voice-ai-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ----------------------------------------------------------------------------
  # 4. Servicio LLM de Estructuración Clínica (ollama-service)
  # ----------------------------------------------------------------------------
  ollama-service:
    build:
      context: ./ollama-service
      dockerfile: Dockerfile
      network: host
    image: voice-ollama-service:1.0.0
    container_name: voice-ollama-service
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Cero puertos expuestos en el host: aislamiento total en voice-ai-net
    expose:
      - "11434"
    tmpfs:
      - /tmp:size=2G,mode=1777
    volumes:
      - ollama_data:/home/ollama/.ollama:rw
    env_file:
      - path: .env
        required: false
    environment:
      - HOME=/home/ollama
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/home/ollama/.ollama/models
      - MODEL_NAME=${LLM_MODEL:-llama3.1:8b-instruct-q4_K_M}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
    networks:
      - voice-ai-net
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 25s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 4G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ----------------------------------------------------------------------------
  # 5. Microservicio RAG & Ingesta Documental (rag-service)
  # ----------------------------------------------------------------------------
  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    image: voice-rag-service:1.0.0
    container_name: voice-rag-service
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      # Solo accesible internamente por la red voice-ai-net (puerto 8090)
      - "8090"
    tmpfs:
      - /tmp:size=512M,mode=1777
    volumes:
      - rag_data:/app/data:rw
    environment:
      - RAG_DATA_DIR=/app/data
      - OLLAMA_URL=http://ollama-service:11434
      - EMBED_MODEL=${LLM_MODEL:-llama3.1:8b-instruct-q4_K_M}
    networks:
      - voice-ai-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G

  # ----------------------------------------------------------------------------
  # 6. Panel de Administración Bastionado Portainer CE (HTTPS Seguro)
  # ----------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:2.21.5-alpine
    container_name: voice-portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # Acceso exclusivo por HTTPS con cifrado SSL
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - voice-ai-net
    deploy:
      resources:
        limits:
          memory: 512M
